[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bioacoustics-dl-toolbox"
version = "0.1.0"
description = "Reusable PyTorch components for bioacoustic classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "resampy>=0.4,<1",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "torch>=2,<3",
  "torchvision>=0.15,<1",
]

[project.optional-dependencies]
rf = ["librosa>=0.10,<1"]
summaries = ["tensorboardX>=2.6,<3"]
test = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[project.urls]
Repository = "https://github.com/darizae/bioacoustics-dl-toolbox"
"Upstream research" = "https://github.com/ChristianBergler/ANIMAL-SPOT"

[tool.hatch.build.targets.wheel]
packages = ["src/bioacoustics_dl_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

