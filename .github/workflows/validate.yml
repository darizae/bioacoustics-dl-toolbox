name: Validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base package and test tools
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest
      - name: Execute README Python examples
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          examples = re.findall(r"```python\n(.*?)```", readme, flags=re.DOTALL)
          assert len(examples) == 2, "Expected the inspection and model-input examples"
          for index, source in enumerate(examples, start=1):
              exec(compile(source, f"README.md example {index}", "exec"), {"__name__": "__main__"})
          print(f"Executed {len(examples)} README Python examples")
          PY
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff formatting
        run: python -m ruff format --check src tests
      - name: Build and inspect distributions
        run: |
          python -m pip install build
          python -m build
          python -m zipfile --list dist/*.whl
          tar -tzf dist/*.tar.gz
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as package:
              names = package.namelist()
              assert any(name.endswith("/LICENSE") for name in names)
              assert any(name.endswith("/NOTICE.md") for name in names)
              assert any(name.endswith("/visualization/spectrogram.py") for name in names)
          with open_tar(sdist, "r:gz") as package:
              names = package.getnames()
              assert any(name.endswith("/LICENSE") for name in names)
              assert any(name.endswith("/NOTICE.md") for name in names)
              assert any(name.endswith("/visualization/spectrogram.py") for name in names)
          print("sdist/wheel include GPL LICENSE, ANIMAL-SPOT NOTICE and public API")
          PY
      - name: Clean installed-wheel import without visualization extras
        run: |
          python -m venv /tmp/toolbox-wheel-check
          /tmp/toolbox-wheel-check/bin/python -m pip install dist/*.whl
          export EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          (cd /tmp && /tmp/toolbox-wheel-check/bin/python - <<'PY'
          import importlib.metadata
          import os
          import sys
          import numpy as np
          from bioacoustics_dl_toolbox.visualization.spectrogram import (
              calculate_stft_power, rasterize_spectrogram,
          )

          assert importlib.metadata.version("bioacoustics-dl-toolbox") == os.environ["EXPECTED_VERSION"]
          assert not {"matplotlib", "PIL", "torchvision"}.intersection(sys.modules)
          power = calculate_stft_power(
              np.zeros((1, 64)), sample_rate_hz=8_000, window_samples=32, hop_samples=16
          )
          raster = rasterize_spectrogram(power, width=12, height=8, palette="magma")
          assert raster.rgb.shape == (8, 12, 3)
          print("Clean wheel:", importlib.metadata.version("bioacoustics-dl-toolbox"))
          print("Installed module:", sys.modules[calculate_stft_power.__module__].__file__)
          PY
          )
      - name: Record source SHA and distribution SHA-256
        run: |
          printf '%s\n' "$GITHUB_SHA" > SOURCE_SHA.txt
          sha256sum dist/* | tee SHA256SUMS
      - name: Preserve exact tested distributions for release
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SOURCE_SHA.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
