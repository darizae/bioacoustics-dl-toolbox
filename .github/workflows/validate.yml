name: Validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base package and test tools
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest
      - name: Execute README Python examples
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          examples = re.findall(r"```python\n(.*?)```", readme, flags=re.DOTALL)
          assert len(examples) == 2, "Expected the inspection and model-input examples"
          for index, source in enumerate(examples, start=1):
              exec(compile(source, f"README.md example {index}", "exec"), {"__name__": "__main__"})
          print(f"Executed {len(examples)} README Python examples")
          PY
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff formatting
        run: python -m ruff format --check src tests
      - name: Headless installed wheel smoke test
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/toolbox-wheel-check
          /tmp/toolbox-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/toolbox-wheel-check/bin/python -c "from bioacoustics_dl_toolbox.visualization.spectrogram import calculate_stft_power, rasterize_spectrogram; print(calculate_stft_power, rasterize_spectrogram)"
